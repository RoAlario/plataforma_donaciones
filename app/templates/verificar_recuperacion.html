<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verificar código</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { background: #f8f9ff; font-family: 'Inter', sans-serif; }
    .card-verificar {
      max-width: 380px; margin: 60px auto; background: #fff;
      border-radius: 20px; padding: 40px 32px;
      box-shadow: 0 4px 20px rgba(0,0,0,.08); text-align: center;
    }
    .logo { width: 65px; margin-bottom: 16px; }
    h2 { font-size: 26px; font-weight: 700; margin-bottom: 10px; }
    .descripcion { font-size: 15px; color: #555; margin-bottom: 28px; }
    .codigos { display: flex; gap: 10px; justify-content: center; margin-bottom: 28px; }
    .codigos input {
      width: 48px; height: 54px; text-align: center;
      font-size: 22px; font-weight: 600;
      border: 2px solid #f27036; border-radius: 10px; outline: none;
    }
    .codigos input:focus { border-color: #a63b00; box-shadow: 0 0 0 3px rgba(242,112,54,.15); }
    .btn-verificar {
      width: 100%; background: #f27036; color: #fff;
      border: none; border-radius: 12px; padding: 14px; font-size: 17px; font-weight: 500;
    }
    .btn-verificar:hover { background: #a63b00; }
    .error { color: #CD1800; font-size: 14px; margin-bottom: 12px; }
  </style>
</head>
<body>
  <div class="card-verificar">
    <img src="{{ url_for('static', filename='logo.png') }}" class="logo" alt="Logo">
    <h2>Verificá tu identidad</h2>
    <p class="descripcion">Ingresá el código de 6 dígitos que te enviamos al email.</p>

    {% if error %}<p class="error">{{ error }}</p>{% endif %}

    <form method="POST">
      <div class="codigos">
        {% for i in range(1, 7) %}
          <input type="text" name="d{{ i }}" maxlength="1" inputmode="numeric" autocomplete="off">
        {% endfor %}
      </div>
      <button type="submit" class="btn-verificar">Confirmar código →</button>
    </form>
  </div>

  <script>
  const inputs = document.querySelectorAll('.codigos input');

  inputs.forEach((inp, idx, arr) => {
    inp.addEventListener('input', e => {
      const val = inp.value.replace(/\D/g, '');
      inp.value = val.slice(0, 1);
      if (inp.value && idx < arr.length - 1) arr[idx + 1].focus();
    });

    inp.addEventListener('keydown', e => {
      if (e.key === 'Backspace' && !inp.value && idx > 0) arr[idx - 1].focus();
    });

    inp.addEventListener('paste', e => {
      e.preventDefault();
      const pegado = (e.clipboardData || window.clipboardData)
        .getData('text').replace(/\D/g, '').slice(0, 6);
      pegado.split('').forEach((char, i) => {
        if (arr[i]) arr[i].value = char;
      });
      const ultimo = Math.min(pegado.length, arr.length - 1);
      arr[ultimo].focus();
    });
  });
</script>
</body>
</html>
